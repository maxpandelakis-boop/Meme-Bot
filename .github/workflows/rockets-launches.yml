# Rocket study (fake money only; research/rockets/PREREG-ROCKETS-2026-10-24.md, amendment 6): every pump.fun launch of the five
# month windows, not only the graduations (research/rockets/launches.py), for the user's ask to compare as many coins as possible.
# Now: probe 3, the three free launch datasets on HuggingFace checked against the chain before any use. Nothing is bought.
# HELIUS_API_KEY is only passed to the script, never printed or saved. Touches no bot branch and no paper account.
# Started by a push of this file or launches.py on this branch, or by hand. One job at a time (the account has few runners).
name: rockets-launches
on:
  push:
    branches: [claude/project-thread-5blkl3]
    paths: [.github/workflows/rockets-launches.yml, research/rockets/launches.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rockets-launches
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet pyarrow==17.0.0 pandas==2.2.3
      - env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p md h2
          git fetch -q --depth 1 origin monthsdata && git archive FETCH_HEAD | tar -x -C md
          git fetch -q --depth 1 origin monthsh2 && git show FETCH_HEAD:meta_h2.parquet > h2/meta_h2.parquet
          python3 research/rockets/meta_fetch.py plan md h2 plan
      - env:
          HK: ${{ secrets.HELIUS_API_KEY }}
        run: python3 research/rockets/launches.py probe3 work plan/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: launches-probe3, path: work/probe3.json, retention-days: 5}
