          probe cg-contract     "https://api.coingecko.com/api/v3/coins/solana/contract/$M"
          probe cg-sol-price    'https://api.coingecko.com/api/v3/simple/price?ids=solana,bitcoin&vs_currencies=usd&include_24hr_change=true'
          probe fear-greed      'https://api.alternative.me/fng/?limit=2'
