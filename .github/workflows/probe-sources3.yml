# Manual probe, round 3: every further source that could help (security, holders, prices, launchpads, social). Prints status, size, count, sample.
name: probe-sources3
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          probe() {  # name url [post-json]
            if [ -n "$3" ]; then
              out=$(curl -sS -o /tmp/body -w '%{http_code} %{time_total}s' --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' -H 'Content-Type: application/json' -d "$3" "$2" 2>&1 || true)
            else
              out=$(curl -sS -o /tmp/body -w '%{http_code} %{time_total}s' --max-time 25 -L -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' -H 'Accept: application/json, text/html, */*' "$2" 2>&1 || true)
            fi
            n=$(jq -r 'def c: if type=="array" then length elif type=="object" then (to_entries|map(select(.value|type=="array" or (.value|type=="object")))|map("\(.key):\(.value|if type=="array" then length else (keys|join("/")) end)")|join(",")|.[0:160]) else type end; c' /tmp/body 2>/dev/null || echo "not json")
            printf '%-20s %-18s %8s bytes  n=%s\n   %s\n\n' "$1" "$out" "$(wc -c </tmp/body)" "$n" "$(head -c 400 /tmp/body | tr '\n' ' ')"
            sleep 0.8
          }
          M=DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263
          P=BaqDcVARx7Bcs73o6pvexwNcpnHuW8z11zaw2Mjepump
          probe goplus-sol      "https://api.gopluslabs.io/api/v1/solana/token_security?contract_addresses=$M"
          probe goplus-sol2     "https://api.gopluslabs.io/api/v1/solana/token_security?contract_addresses=$P"
          probe rpc-largest     'https://api.mainnet-beta.solana.com' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getTokenLargestAccounts\",\"params\":[\"$M\"]}"
          probe rpc-supply      'https://api.mainnet-beta.solana.com' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getTokenSupply\",\"params\":[\"$M\"]}"
          probe jup-price-v3    "https://lite-api.jup.ag/price/v3?ids=$M,So11111111111111111111111111111111111111112,$P"
          probe jup-price-v2    "https://lite-api.jup.ag/price/v2?ids=$M,$P"
          probe gt-token-info   "https://api.geckoterminal.com/api/v2/networks/solana/tokens/$M/info"
          probe gt-token-multi  "https://api.geckoterminal.com/api/v2/networks/solana/tokens/multi/$M,$P"
          probe rc-votes        "https://api.rugcheck.xyz/v1/tokens/$M/votes"
          probe rc-insiders     "https://api.rugcheck.xyz/v1/tokens/$M/insiders/graph"
          probe solscan-pub     "https://public-api.solscan.io/token/holders?tokenAddress=$M&limit=10&offset=0"
          probe solscan-v2      "https://api.solscan.io/v2/token/holders?token=$M&page=1&page_size=10"
          probe orca-pools      'https://api.orca.so/v2/solana/pools?limit=50&sort=volume24h&order=desc'
