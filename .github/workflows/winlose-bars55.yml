# Winner/loser study (fake money only): the history2 one-minute bars of each coin's first 55 hours (for longer holding times) into
# the data-only branch "chartbars55". Runs only on a push of this file on this branch; touches no bot branch and no paper account.
name: winlose-bars55
on:
  push:
    branches: [claude/project-thread-er8ru4]
    paths: [.github/workflows/winlose-bars55.yml]
permissions:
  contents: write
  actions: read
jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet pyarrow==17.0.0 pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: bars
          path: bars
          run-id: 39668736908
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: git fetch -q --depth 1 origin history2 && git show FETCH_HEAD:coins.parquet > coins.parquet
      - run: KEEP_H=55 python3 research/winlose/chartbars_build.py bars coins.parquet out
      - name: Push to the chartbars55 branch
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd out && du -sh . && git init -q && git checkout -q -b chartbars55 && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "chartbars55" \
            && git push -q --force "$URL" chartbars55
