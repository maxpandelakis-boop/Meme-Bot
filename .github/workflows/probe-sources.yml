# Manual probe: which extra list endpoints answer, and with how many coins? Prints status, size and a sample per URL.
name: probe-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          probe() {  # name url
            out=$(curl -sS -o /tmp/body -w '%{http_code} %{time_total}s' --max-time 25 -A 'Mozilla/5.0' -H 'Accept: application/json' "$2" 2>&1 || true)
            n=$(python3 -c "
import json,sys
try:
  d=json.load(open('/tmp/body'))
except Exception as e:
  print('not json'); sys.exit()
def count(x):
  if isinstance(x,list): return len(x)
  if isinstance(x,dict):
    for k in ('data','pairs','coins','tokens','result','items'):
      if k in x: return str(k)+':'+str(count(x[k]))
    return 'keys:'+','.join(list(x)[:8])
  return type(x).__name__
print(count(d))")
            printf '%-22s %-20s %7s bytes  n=%-14s %s\n' "$1" "$out" "$(wc -c </tmp/body)" "$n" "$2"
            head -c 260 /tmp/body | tr '\n' ' '; echo; echo
            sleep 0.5
          }
          probe gt-dexes        'https://api.geckoterminal.com/api/v2/networks/solana/dexes?page=1'
          probe gt-pumpswap-p1  'https://api.geckoterminal.com/api/v2/networks/solana/dexes/pumpswap/pools?include=base_token&page=1&sort=h24_volume_usd_desc'
          probe gt-pumpswap-p10 'https://api.geckoterminal.com/api/v2/networks/solana/dexes/pumpswap/pools?include=base_token&page=10&sort=h24_volume_usd_desc'
          probe gt-raydium-p5   'https://api.geckoterminal.com/api/v2/networks/solana/dexes/raydium/pools?include=base_token&page=5&sort=h24_tx_count_desc'
          probe gt-meteora      'https://api.geckoterminal.com/api/v2/networks/solana/dexes/meteora/pools?include=base_token&page=1'
          probe gt-new-p10      'https://api.geckoterminal.com/api/v2/networks/solana/new_pools?include=base_token&page=10'
          probe gt-trend-1h     'https://api.geckoterminal.com/api/v2/networks/solana/trending_pools?include=base_token&duration=1h&page=1'
          probe gt-trend-6h     'https://api.geckoterminal.com/api/v2/networks/solana/trending_pools?include=base_token&duration=6h&page=3'
          probe pf-mcap-desc    'https://frontend-api-v3.pump.fun/coins?offset=0&limit=50&sort=market_cap&order=DESC&includeNsfw=false'
          probe pf-usdmcap      'https://frontend-api-v3.pump.fun/coins?offset=0&limit=50&sort=usd_market_cap&order=DESC&includeNsfw=false'
          probe pf-mcap-off1000 'https://frontend-api-v3.pump.fun/coins?offset=1000&limit=50&sort=market_cap&order=DESC&includeNsfw=false'
          probe pf-lasttrade    'https://frontend-api-v3.pump.fun/coins?offset=0&limit=50&sort=last_trade_timestamp&order=DESC&includeNsfw=false'
          probe pf-complete     'https://frontend-api-v3.pump.fun/coins?offset=0&limit=50&sort=last_trade_timestamp&order=DESC&includeNsfw=false&complete=true'
          probe pf-koth         'https://frontend-api-v3.pump.fun/coins/king-of-the-hill?includeNsfw=false'
          probe pf-live         'https://frontend-api-v3.pump.fun/coins/currently-live?offset=0&limit=50&includeNsfw=false'
          probe pf-featured     'https://frontend-api-v3.pump.fun/coins/featured/24h?offset=0&limit=50&includeNsfw=false'
          probe jup-search      'https://lite-api.jup.ag/tokens/v2/search?query=pump'
          probe jup-recent      'https://lite-api.jup.ag/tokens/v2/recent'
          probe jup-traded1h    'https://lite-api.jup.ag/tokens/v2/toptraded/1h?limit=100'
          probe jup-organic1h   'https://lite-api.jup.ag/tokens/v2/toporganicscore/1h?limit=100'
          probe jup-trend6h     'https://lite-api.jup.ag/tokens/v2/toptrending/6h?limit=100'
          probe jup-tag-verified 'https://lite-api.jup.ag/tokens/v2/tag?query=verified'
          probe rc-recent       'https://api.rugcheck.xyz/v1/stats/recent'
          probe rc-trending     'https://api.rugcheck.xyz/v1/stats/trending'
          probe rc-verified     'https://api.rugcheck.xyz/v1/stats/verified'
          probe ds-pairs        'https://api.dexscreener.com/latest/dex/pairs/solana/9QQ53i6o3tFNfcCrxwhb5tepdwaiBiq5PHc5nzLGGz9u'
          probe ds-search-a     'https://api.dexscreener.com/latest/dex/search?q=a'
          probe ds-search-sol   'https://api.dexscreener.com/latest/dex/search?q=SOL'
          probe ds-search-pumpfun 'https://api.dexscreener.com/latest/dex/search?q=pumpfun'
          probe ds-profiles     'https://api.dexscreener.com/token-profiles/latest/v1'
          probe cg-list-sol     'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=solana-meme-coins&order=volume_desc&per_page=250&page=1'
          probe cg-list-sol2    'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=solana-meme-coins&order=volume_desc&per_page=250&page=2'
          probe gt-ratelimit    'https://api.geckoterminal.com/api/v2/networks/solana/pools?include=base_token&page=10&sort=h24_tx_count_desc'
