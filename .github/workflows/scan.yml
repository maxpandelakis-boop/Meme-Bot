# The bot on GitHub's own servers: no laptop needed.
# Runs about every hour, started through the GitHub API by keepalive.py (the bots that run all day call it every 10 to 15 minutes: 55
# minutes after the last scan began; a cron start on GitHub's own scheduler comes 10 to 60 minutes late or not at all),
# and whenever you press "Run workflow" (github.com -> Actions -> Meme-Bot scan). The cron below is the safety net: it fires at :25 and
# does nothing when this hour's scan was started.
# Each run restores the bot's state from the results branch, scans ~12,000 coins, names the best coin for the next two hours,
# pushes report.html + the small docs back to the results branch and shows the picks in the run's summary. While the scan runs,
# bot.py force-pushes the Agent office record to the one-commit branch "live" (every 45 s when it changed, at least once a minute);
# the website's office tab reads it.
# When GitHub Pages is switched on (Settings -> Pages -> Source: GitHub Actions; needs a public repository on the free plan),
# the second job publishes the page as a website that phones can keep on the home screen.
# The iPhone app (README "iPhone app"): with the repository secrets SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY the
# scan also writes its live view to a free Supabase project every few seconds and sends push notifications (the pick made; new coins
# listed only with the repository variable MEMEBOT_PUSH_YOUNG=1) through pywebpush, which a step below installs only when those secrets
# exist; without them the run is exactly as before.
# The launch radar (radar.yml, its own job: a round every 2 minutes, each run an hour that starts the next) and this scan meet in four soft steps
# that never hold up the scan: the scan imports the radar's records (branch radar-data) for the page and the results branch, feeds the
# radar its wallet memory (branch radar-feed), exports its records once a day with the big test, and starts the radar at its start
# when none runs (inside the radar's active hours). A second job,
# peaks, runs after the scan: first the radar account's buys (radar_paper.py, called from peak.py run: at most 15 windows, in at
# most 4 of its ten minutes and 3 of GeckoTerminal's rate limits), then on the rest the closed 6-hour windows of the paper positions
# (best price within 6 h, hindsight), on the same client, whose requests go further apart after each rate limit; then it replays
# other stops and targets on the closed paper trades (exit_grid.py, hindsight, a report: the trader keeps its rule), the Pick's shadow rules
# (shadow.py: four other sell rules on each pick buy's 12-hour minute path, a report: the Pick keeps its rule), the Learning Pick's sales
# (lernpick.py: its own paper account, each buy sold by its own rule on a 6-hour minute path), and last the learning
# trader's daily step (traders.py: three paper traders on the same coins, the stop-loss account, the best price looking back, and one that
# learns only from finished trades and writes one frozen decision per group and day; its radar skip signs go to radar-feed for the push).
# Fake money only: nothing is bought anywhere.
name: Meme-Bot scan
run-name: "${{ inputs.source == 'hourly' && 'Hourly scan' || (github.event_name == 'schedule' && 'Safety-net scan' || 'Scan now') }} · ${{ inputs.horizon || '2h' }} profile${{ inputs.rescan && ' · fresh snapshot' || '' }}"
on:
  schedule:
    - cron: '25 * * * *'            # UTC, the safety net only: the routine starts the real scan at :10; a scheduled run that finds this hour's scan skips itself
  workflow_dispatch:
    inputs:
      horizon:
        description: 'rule profile: 2h (pump in the next two hours) or 24h (survive a day)'
        type: choice
        options: ['2h', '24h']
        default: '2h'
      rescan:
        description: 'force a full scan with a fresh big-test snapshot'
        type: boolean
        default: false
      source:
        description: 'who starts it: the hourly routine passes "hourly" (shown in the run name)'
        type: choice
        options: ['manual', 'hourly']
        default: 'manual'
      export:
        description: 'also export the big-test results to the bigtest branch now (otherwise once a day, at the 06 UTC scan)'
        type: boolean
        default: false
permissions:
  contents: write                    # the results branch, the bigtest branch and the one-commit "live" branch the scan pushes while it runs
  actions: write                     # the tidy-up step deletes old runs of this workflow
concurrency:
  group: memebot-scan              # a button press while a scheduled run is going waits for it instead of racing it
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55              # a full scan took 32 to 49 minutes on 2026-10-16; bot.py stops the training 36 min into the cycle (TRAIN_WAIT_S)
    outputs:
      skipped: ${{ steps.recent.outputs.skip }}
    env:
      PYTHONUTF8: '1'
      LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
      BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
      RESULTS_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      HORIZON: ${{ github.event.inputs.horizon || '2h' }}
      RESCAN: ${{ github.event.inputs.rescan == 'true' && '--rescan' || '' }}
      HAS_SUPABASE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}   # only true or false: the secrets themselves go to the steps that use them
    steps:
      - name: Safety net only - skip when this hour's scan was started
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # measured from this run's own creation (it fires at :25, GitHub starts it 10 to 60 minutes late, and it may wait behind a
          # running scan): a scan started by hand or by keepalive.py (55 minutes after the last one began) in the 55 minutes before it,
          # still waiting, running or done well, is this hour's scan. Other safety-net runs do not count: one that skipped itself also
          # ends as a success.
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/scan.yml/runs?per_page=20"
          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api")
          mine=$(echo "$runs" | jq -r --argjson me "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id == $me) | .created_at][0] // empty')
          t=$(date -u -d "${mine:-now}" +%s)
          since=$(date -u -d "@$((t - 3300))" +%Y-%m-%dT%H:%M:%SZ)
          n=$(echo "$runs" | jq -r --arg s "$since" --argjson me "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $me and .event != "schedule" and .created_at > $s and (.status != "completed" or .conclusion == "success"))] | length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This hour's scan was started (the hourly routine did its job): this safety-net run does nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No scan was started this hour: the safety net runs the scan." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start the launch radar (inside its hours, when no radar run is going; a minute at most)
        if: always() && steps.recent.outputs.skip != 'true' && (vars.MEMEBOT_RADAR || '1') != '0'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_REF: ${{ github.ref_name }}
          MEMEBOT_RADAR_HOURS: ${{ vars.MEMEBOT_RADAR_HOURS || '0-24' }}
        run: |
          # The radar makes a round every 2 minutes; each run lasts 55 minutes and starts the next itself. This step, first in the scan (so
          # the radar is going within minutes of the first scan after the hours begin), is the safety net: it starts radar.yml (source
          # hourly) when no radar run is going, only when that workflow is active (Disable workflow
          # on the Actions page is the stop switch, and a disabled workflow refuses every start), the Berlin time is inside
          # MEMEBOT_RADAR_HOURS ("0-24", around the clock, unless the variable says otherwise; "22-6" wraps past midnight) and no radar run is running or
          # waiting: any status but completed counts (queued, waiting, pending, requested, in progress). Three GitHub API calls at most;
          # the token is sent only to GitHub's API.
          python3 - <<'PY'
          import datetime as dt, json, os, re, sys, urllib.error, urllib.request
          wf = "%s/repos/%s/actions/workflows/radar.yml" % (os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/"), os.environ["GITHUB_REPOSITORY"])
          say = lambda s: print("radar round: " + s, flush=True)

          def hours(s):               # the radar's own rule (launch_radar.parse_hours): "a-b" Berlin hours, "a-a" all day, else 0-24
              m = re.fullmatch(r"\s*(\d{1,2})\s*-\s*(\d{1,2})\s*", str(s or ""))
              if not m:
                  return 0, 24
              a, b = int(m.group(1)), int(m.group(2))
              if not (0 <= a <= 23 and 1 <= b <= 24) or a == b:
                  return 0, 24
              return a, b

          def berlin():
              t = dt.datetime.now(dt.timezone.utc)
              try:
                  from zoneinfo import ZoneInfo
                  return t.astimezone(ZoneInfo("Europe/Berlin"))
              except Exception:       # no time zone data: the EU summer-time rule
                  last_sun = lambda y, m: max(x for x in (dt.datetime(y, m, d, 1, tzinfo=dt.timezone.utc) for d in range(25, 32)) if x.weekday() == 6)
                  return t + dt.timedelta(hours=2 if last_sun(t.year, 3) <= t < last_sun(t.year, 10) else 1)

          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method, data=None if body is None else json.dumps(body).encode(),
                                           headers={"Authorization": "Bearer " + os.environ.get("GH_TOKEN", ""), "Accept": "application/vnd.github+json",
                                                    "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "memebot-scan", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as e:
                  return e.code, None

          a, b = hours(os.environ.get("MEMEBOT_RADAR_HOURS"))
          now = berlin()
          h = now.hour + now.minute / 60.0
          if not (a <= h < b if a < b else (h >= a or h < b)):
              say("%s Berlin is outside the active hours %d-%d: no start" % (now.strftime("%H:%M"), a, b))
              sys.exit(0)
          try:
              st, w = call("GET", wf)
              if st == 404:
                  say("radar.yml is not on this branch: no start")
              elif st != 200 or not isinstance(w, dict):
                  say("the radar workflow could not be read (HTTP %s): no start" % st)
              elif w.get("state") != "active":
                  say("the radar workflow is %s (Disable workflow stops it): no start" % re.sub(r"[^a-z_]", "", str(w.get("state")))[:30])
              else:
                  st, j = call("GET", wf + "/runs?per_page=20")
                  runs = j.get("workflow_runs") if isinstance(j, dict) else None
                  if st != 200 or not isinstance(runs, list):
                      say("the radar runs could not be read (HTTP %s): no start" % st)
                  elif any(isinstance(r, dict) and r.get("status") != "completed" for r in runs):
                      alive = sorted({re.sub(r"[^a-z_]", "", str(r.get("status")))[:20] for r in runs if isinstance(r, dict) and r.get("status") != "completed"})
                      say("a radar run is still going (%s): no second one" % ", ".join(alive))
                  elif not os.environ.get("RADAR_REF"):
                      say("no branch to start it on: no start")
                  else:
                      st, _ = call("POST", wf + "/dispatches", {"ref": os.environ["RADAR_REF"], "inputs": {"source": "hourly"}})
                      say("started the radar (source hourly: a round every 2 minutes, its first in about 2)" if st in (200, 201, 204) else "the start was refused (HTTP %s)" % st)
          except Exception as e:
              say("GitHub did not answer (%s): no start" % type(e).__name__)
          PY
      - uses: actions/checkout@v4
        if: steps.recent.outputs.skip != 'true'
      - name: Restore the bot's state from the results branch
        if: steps.recent.outputs.skip != 'true'
        run: |
          # git ls-remote --exit-code: 0 the branch is there, 2 it is not (a fresh start), anything else the check failed (network, token,
          # GitHub down): then this run stops, so that an empty state is never pushed over the results (tried 3 times, 10 s apart)
          for i in 1 2 3; do
            rc=0; git ls-remote --exit-code --heads "$RESULTS_URL" results >/dev/null || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then break; fi
            sleep 10
          done
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch results "$RESULTS_URL" mb || (sleep 10 && git clone -q --depth 1 --branch results "$RESULTS_URL" mb)
            echo "state restored: $(git -C mb log -1 --format='%h %s')"
          elif [ "$rc" -eq 2 ]; then
            mkdir -p mb && echo "no results branch yet: fresh start"
          else
            echo "the results branch could not be checked (git exit $rc): this scan stops, the results stay as they are"
            exit 1
          fi
      - name: The nightly filter search's result for the page, the rocket hunter's round and the Learning Pick's brain (read only; each is written on its own branch)
        # before the scan: the scan builds the page, so the filter search and the rocket hunter's round (the Radar tab's fallback, the
        # coins in the brain) are on it only when their docs are already here (copied after the scan, they never reached the page)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true      # a report: without it the page shows "no search yet"
        timeout-minutes: 1
        env:
          RESULTS_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$RESULTS_URL" filtersearch >/dev/null; then
            git fetch -q --depth 1 "$RESULTS_URL" filtersearch && mkdir -p mb/db/memebot && git show FETCH_HEAD:filtersearch.json > mb/db/memebot/filtersearch.json \
              && echo "filter search doc copied ($(wc -c < mb/db/memebot/filtersearch.json) bytes)"
          else
            echo "no filter search yet"
          fi
          if git ls-remote --exit-code --heads "$RESULTS_URL" rocket-data >/dev/null; then
            git fetch -q --depth 1 "$RESULTS_URL" rocket-data && mkdir -p mb/db/memebot && git show FETCH_HEAD:rocket.json > mb/db/memebot/rocket.json \
              && echo "rocket hunter doc copied ($(wc -c < mb/db/memebot/rocket.json) bytes)"
          fi
          # the Learning Pick's brain (lernpick.py train, nightly in filtersearch.yml): the scan's buy step and the page read it
          if git ls-remote --exit-code --heads "$RESULTS_URL" lernpick >/dev/null; then
            git fetch -q --depth 1 "$RESULTS_URL" lernpick && mkdir -p mb/db/memebot && git show FETCH_HEAD:lernpick.json > mb/db/memebot/lernpick.json \
              && echo "learning pick brain copied ($(wc -c < mb/db/memebot/lernpick.json) bytes)"
          else
            echo "no learning pick brain yet"
          fi
          # the Rocket seeker's account (seeker_watch.py, a test bot with money of its own, seeker.yml): the Start box and its fold
          if git ls-remote --exit-code --heads "$RESULTS_URL" seeker-data >/dev/null; then
            git fetch -q --depth 1 "$RESULTS_URL" seeker-data && mkdir -p mb/db/memebot && git show FETCH_HEAD:seeker.json > mb/db/memebot/seeker.json \
              && echo "rocket seeker doc copied ($(wc -c < mb/db/memebot/seeker.json) bytes)"
          fi
      - name: Import the launch radar's records (branches radar-data and radar-feed; a minute at most, the scan never depends on it)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # radar-feed (written by "Feed the launch radar" below): the wallet memory and the X-link index go to mb/ for the page and the
          # next feed. radar-data (written only by the radar job): radar.json goes to mb/radar_live.json for the page, the hour docs of its
          # last 48 hours to mb/db/memeradar (the results branch keeps them 30 days). Files are added or overwritten, never deleted (a wiped
          # radar-data branch cannot wipe the results copy), each checked first (a JSON object; an hour doc named by its hour, with its
          # time) and written whole. Each branch has its own fetch and time limit, radar-feed first (its X-link history exists nowhere
          # else); every git call ends within 50 s, so the mark mb/.radar_feed_import (for the feed step: ok, none when there is nothing to
          # keep, failed) is always written. A missing branch is one line. The trader never reads any of these files.
          python3 - <<'PY'
          import gzip, json, math, os, re, shutil, signal, subprocess, time
          url, mb = os.environ["RESULTS_URL"], "mb"
          tmp = os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "radar-import")
          HOUR = re.compile(r"db/memeradar/\d{4}-\d{2}-\d{2}T\d{2}\.json")
          END = time.monotonic() + 50
          say = lambda s: print("radar import: " + s, flush=True)

          def git(repo, *a, t=18):    # ls-remote 15 s, each fetch 18 s, all within END; in its own process group, so that a timeout
              left = END - time.monotonic()                     # kills git and its https helper together
              if left < 1:
                  raise subprocess.TimeoutExpired("git " + a[0], 0)
              p = subprocess.Popen(["git", "-C", repo] + list(a), stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              try:
                  out, _ = p.communicate(timeout=min(t, left))
              except subprocess.TimeoutExpired:
                  os.killpg(p.pid, signal.SIGKILL)
                  p.communicate()
                  raise
              return p.returncode, out

          def obj(raw, gz=False):
              try:
                  d = json.loads((gzip.decompress(raw) if gz else raw).decode("utf-8"))
              except (OSError, EOFError, ValueError, UnicodeDecodeError):
                  return None
              return d if isinstance(d, dict) else None

          def put(rel, raw):          # whole or not at all: a temp file in mb/.radartmp (never synced), then a rename
              os.makedirs(os.path.join(mb, ".radartmp"), exist_ok=True)
              dst = os.path.join(mb, rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              part = os.path.join(mb, ".radartmp", os.path.basename(rel))
              with open(part, "wb") as f:
                  f.write(raw)
              os.replace(part, dst)

          def mark(s):                # for the feed step: was radar-feed's X-link index brought in
              put(".radar_feed_import", s.encode())

          def tree(repo):             # {path: blob sha} of the fetched commit's plain files; a failed local git raises, so the
              rc, raw = git(repo, "ls-tree", "-r", "-z", "--full-tree", "FETCH_HEAD")   # mark stays failed, never none
              if rc != 0:
                  raise RuntimeError("git ls-tree exit %d" % rc)
              out = {}
              for e in raw.decode("utf-8", "replace").split("\0"):
                  meta, _, path = e.partition("\t")
                  if meta.split(" ")[:2] == ["100644", "blob"]:
                      out[path] = meta.split(" ")[2]
              return out

          def blob(repo, sha, cap):
              rc, raw = git(repo, "cat-file", "blob", sha)
              if rc != 0:
                  raise RuntimeError("git cat-file exit %d" % rc)
              return raw if len(raw) <= cap else None

          def feed(heads, repo):
              if "refs/heads/radar-feed" not in heads:
                  mark("none")
                  return "no branch radar-feed yet: the page's wallet check shows unknown"
              rc = git(repo, "fetch", "-q", "--depth", "1", url, "refs/heads/radar-feed")[0]
              if rc != 0:
                  return "radar-feed could not be fetched (git exit %d): the page's wallet check shows unknown; the feed step tries once more" % rc
              files, got = tree(repo), []
              for name in ("walletmem.json.gz", "xlinks.json.gz"):
                  raw = blob(repo, files[name], 95 << 20) if name in files else None
                  d = obj(raw, gz=True) if raw is not None else None
                  if d is not None and d.get("v") == 1:
                      put(name, raw)
                      got.append(name)
              mark("ok" if "xlinks.json.gz" in got else "none")      # none: radar-feed holds no usable X-link index, so nothing to keep
              return "radar-feed: %s" % (", ".join(got) + " into mb/" if got else "no usable file")

          def data(heads, repo):
              if "refs/heads/radar-data" not in heads:
                  return "no branch radar-data yet (the radar has not run): no records"
              rc = git(repo, "fetch", "-q", "--depth", "1", url, "refs/heads/radar-data")[0]
              if rc != 0:
                  return "radar-data could not be fetched (git exit %d): the records keep the results branch's copy" % rc
              files, n, bad = tree(repo), 0, 0
              for path in sorted(files):
                  if not HOUR.fullmatch(path):
                      continue
                  raw = blob(repo, files[path], 8 << 20)
                  d = obj(raw) if raw is not None else None
                  t = d.get("t") if d else None
                  if not (isinstance(t, (int, float)) and not isinstance(t, bool) and math.isfinite(t)):
                      bad += 1
                      continue
                  put(path, raw)
                  n += 1
              raw = blob(repo, files["radar.json"], 1 << 20) if "radar.json" in files else None
              live = raw is not None and obj(raw) is not None
              if live:
                  put("radar_live.json", raw)
              return "radar-data: %d hour docs into mb/db/memeradar%s; radar.json %s" % (
                  n, " (%d skipped: not a JSON object with its time)" % bad if bad else "", "as mb/radar_live.json" if live else "missing or not a JSON object")

          try:
              shutil.rmtree(tmp, ignore_errors=True)
              for r in ("feed", "data"):
                  subprocess.run(["git", "init", "-q", os.path.join(tmp, r)], check=True, capture_output=True)
              mark("failed")
              rc, out = git(os.path.join(tmp, "feed"), "ls-remote", "--heads", url, "radar-data", "radar-feed", t=15)
              if rc != 0:
                  say("the remote did not answer (git exit %d): nothing imported" % rc)
              else:
                  heads = {l.split("\t", 1)[1] for l in out.decode("utf-8", "replace").splitlines() if "\t" in l}
                  for name, part, repo in (("radar-feed", feed, "feed"), ("radar-data", data, "data")):
                      try:
                          say(part(heads, os.path.join(tmp, repo)))
                      except subprocess.TimeoutExpired:
                          say("%s took too long: %s" % (name, "the page's wallet check shows unknown; the feed step tries once more" if name == "radar-feed"
                                                            else "the records keep the results branch's copy (hour docs copied so far stay)"))
                      except Exception as e:
                          say("%s stopped (%s): what was copied stays" % (name, type(e).__name__))
          except subprocess.TimeoutExpired:
              say("the remote took too long to answer: nothing imported")
          except Exception as e:
              say("stopped (%s): nothing imported" % type(e).__name__)
          finally:
              shutil.rmtree(os.path.join(mb, ".radartmp"), ignore_errors=True)
              shutil.rmtree(tmp, ignore_errors=True)
          PY
      - name: Keep the big-test snapshots between runs
        if: steps.recent.outputs.skip != 'true'
        uses: actions/cache/restore@v4     # saved right after the scan step below, also when that step failed or ran out of time
        with:
          path: |
            mb/db/memesnap
            mb/db/memesnapres
          key: memebot-snaps-${{ github.run_id }}
          restore-keys: memebot-snaps-
      - name: Install the push sender for the iPhone app (only with the Supabase secrets; a minute at most, the scan never depends on it)
        if: steps.recent.outputs.skip != 'true' && env.HAS_SUPABASE == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          RESULTS_URL: ''            # the GitHub token stays out of this step
        run: |
          # pywebpush 2.5.0 and every package it needs, exactly as pinned in supabase/push-requirements.txt (each file checked against its
          # sha256; wheels only, so nothing runs while installing; nothing newer is ever fetched), into a folder of its own: the system
          # Python refuses pip installs into itself (PEP 668) on ubuntu 24.04 and on 26.04 (ubuntu-latest from late October 2026). bot.py
          # keeps running on the system Python and imports pywebpush from that folder (MEMEBOT_PUSH_LIB, placed after the standard library)
          # only when it makes the VAPID keys or sends a notification. PyPI down or slow: no notifications this run, the scan goes on.
          lib=""
          opts="-q --disable-pip-version-check --no-input --retries 1 --timeout 10 --require-hashes --only-binary=:all: --no-deps -r supabase/push-requirements.txt"
          if python3 -m venv "$RUNNER_TEMP/pushenv" 2>/dev/null && timeout 60 "$RUNNER_TEMP/pushenv/bin/python" -m pip install $opts; then
            lib=$("$RUNNER_TEMP/pushenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          elif timeout 60 python3 -m pip install $opts --target "$RUNNER_TEMP/pushlib"; then
            lib="$RUNNER_TEMP/pushlib"     # no venv module on this runner: pip's --target needs none and is not refused by PEP 668
          fi
          # http-ece 1.2.1 has no wheel: its one module comes from its sdist, checked against the sha256 PyPI lists (supabase/pin_push.py
          # prints it), without running its setup.py
          ece="$RUNNER_TEMP/http_ece-1.2.1.tar.gz"
          if [ -n "$lib" ] && timeout 30 curl -fsSL --retry 1 -o "$ece" \
               "https://files.pythonhosted.org/packages/7c/af/249d1576653b69c20b9ac30e284b63bd94af6a175d72d87813235caf2482/http_ece-1.2.1.tar.gz" \
             && echo "8c6ab23116bbf6affda894acfd5f2ca0fb8facbcbb72121c11c75c33e7ce8cff  $ece" | sha256sum -c --quiet - \
             && tar -xzf "$ece" -C "$lib" --strip-components=1 http_ece-1.2.1/http_ece/__init__.py \
             && MEMEBOT_PUSH_LIB="$lib" python3 -c "import app; app._push_path(); import pywebpush, http_ece, cryptography" 2>/dev/null; then
            echo "MEMEBOT_PUSH_LIB=$lib" >> "$GITHUB_ENV"
            echo "pywebpush 2.5.0 ready (pinned, hashes checked): this scan sends push notifications"
          else
            echo "pywebpush could not be installed: no push notifications this run, the scan and the live view go on"
          fi
      - name: Scan and recommend
        id: scan
        if: steps.recent.outputs.skip != 'true'
        env:
          MEMEBOT_LIVE: '1'          # the office record goes to the branch "live" (RESULTS_URL) every 45 s to 60 s while the scan runs: the website shows it live
          MEMEBOT_EARLY: ${{ vars.MEMEBOT_EARLY || '1' }}   # the early list of new launches (radar.py); the repository variable MEMEBOT_EARLY=0 switches it off
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                          # the iPhone app's live store (every 5 s while it changes) and push notifications;
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}  # empty without the secrets: nothing of it runs
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}            # sent only in the apikey header to SUPABASE_URL, never printed
          MEMEBOT_PUSH_YOUNG: ${{ vars.MEMEBOT_PUSH_YOUNG || '0' }}          # the "new coins" push of the early list: off unless the variable is 1 (the radar pushes coins without a trap found)
          MEMEBOT_LERNPICK: ${{ vars.MEMEBOT_LERNPICK || '1' }}              # the Learning Pick's paper buys (lernpick.py, a shadow bot, no push); the repository variable MEMEBOT_LERNPICK=0 stops them
        timeout-minutes: 48          # inside the job's 55 with the steps before it (a minute, five at most) and the snapshots' save after it
        run: python3 bot.py cycle --recommend --horizon "$HORIZON" $RESCAN
      - name: Save the big-test snapshots (also after a scan that failed or ran out of time, so its new snapshots are not lost)
        if: always() && steps.recent.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            mb/db/memesnap
            mb/db/memesnapres
          key: memebot-snaps-${{ github.run_id }}
      - name: Export the big-test results to the bigtest branch for offline research (once a day at the 06 UTC scan, or when asked)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}      # only to read the last export's count from GitHub's API
        run: |
          if [ "$(date -u +%H)" != "06" ] && [ "${{ inputs.export }}" != "true" ]; then echo "bigtest export: once a day at the 06 UTC scan, or with the export input"; exit 0; fi
          # the snapshots live only in the actions cache and on this branch: a cache that came back small (lost, evicted) must not
          # overwrite the branch, so an export with clearly fewer results than the last one (count.txt) is skipped
          n=$(ls mb/db/memesnapres 2>/dev/null | wc -l)
          old=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/count.txt?ref=bigtest" 2>/dev/null | tr -cd '0-9' | head -c 12)
          if [ -n "$old" ] && [ "$n" -lt $((old * 9 / 10)) ]; then
            echo "bigtest export skipped: $n snapshot results now, $old in the last export (a lost cache?): the branch stays as it is"; exit 0
          fi
          rm -rf bt && mkdir -p bt && echo "$n" > bt/count.txt
          tar -C mb/db -czf - memesnapres | split -b 90m - bt/memesnapres.tgz.part-   # GitHub refuses files over 100 MB; research/get_data.sh joins the parts
          tar -C mb/db -czf bt/memeweights.tgz memeweights 2>/dev/null || true
          if [ -d mb/db/memeradar ]; then tar -C mb/db -czf bt/memeradar.tgz memeradar; fi      # the launch radar's records (30 days)
          cp mb/db/memebot/train.json bt/ 2>/dev/null || true
          cd bt && git init -q && git checkout -q -b bigtest && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "big-test results $(date -u +%Y-%m-%dT%H:%MZ)" \
            && git push -q --force "$RESULTS_URL" bigtest && echo "bigtest branch updated: $(du -ch memesnapres.tgz.part-* | tail -1 | cut -f1) in $(ls memesnapres.tgz.part-* | wc -l) part(s)"
      - name: Push the page and the small docs to the results branch
        if: steps.recent.outputs.skip != 'true'
        run: python3 bot.py sync --remote "$RESULTS_URL"
      - name: Feed the launch radar (wallet memory, X links and symbols to the branch radar-feed; three minutes at most)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # traps.py feed reads only mb/ (the scored snapshots for the wallet memory, the X links pump.fun and DexScreener list, the
          # symbols' market caps) at this scan's clock (the newest run doc's time; a doc dated over 10 minutes past the wall clock is
          # ignored) and writes four files. They go to the branch radar-feed as one commit, force-pushed (this step is that branch's only
          # writer); the radar job reads them. All four or none. A fifth, t3skip.json (traders.py skipfeed, once the learning trader has a
          # radar decision): the radar signs it skips, which the radar then does not push (it still rates, lists and buys them on paper). The new X-link index is merged with the one on radar-feed (30 days, kept
          # nowhere else), which step A brought into mb/: its mark says ok, or none when there is nothing to keep. Otherwise this step
          # fetches that index once more, and when that fails too, radar-feed is left as it is: a feed from this scan alone would drop the
          # history (the radar's wallet memory is then one scan older, inside its 3-hour limit).
          got=$(cat mb/.radar_feed_import 2>/dev/null || true)
          if [ "$got" != ok ] && [ "$got" != none ]; then
            got=$(python3 - <<'PY'
          import gzip, json, os, shutil, signal, subprocess, sys
          url, tmp = os.environ["RESULTS_URL"], os.path.join(os.environ.get("RUNNER_TEMP") or "/tmp", "radar-feed-prev")

          def git(*a, t):             # in its own process group: a timeout kills git and its https helper together
              p = subprocess.Popen(["git", "-C", tmp] + list(a), stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              try:
                  return p.communicate(timeout=t)[0], p.returncode
              except subprocess.TimeoutExpired:
                  os.killpg(p.pid, signal.SIGKILL)
                  p.communicate()
                  return b"", -1

          got, why = "failed", ""
          try:
              shutil.rmtree(tmp, ignore_errors=True)
              subprocess.run(["git", "init", "-q", tmp], check=True, capture_output=True)
              out, rc = git("ls-remote", "--heads", url, "radar-feed", t=15)
              if rc == 0 and not out.strip():
                  got, why = "none", "there is no branch radar-feed, so a fresh index"
              elif rc != 0 or git("fetch", "-q", "--depth", "1", url, "refs/heads/radar-feed", t=30)[1] != 0:
                  why = "radar-feed could not be fetched here either"
              else:
                  lst, rc = git("ls-tree", "FETCH_HEAD", "xlinks.json.gz", t=10)
                  raw, rc2 = git("cat-file", "blob", "FETCH_HEAD:xlinks.json.gz", t=10) if rc == 0 and lst.strip() else (b"", 0)
                  try:
                      d = json.loads(gzip.decompress(raw).decode("utf-8")) if raw else None
                  except (OSError, EOFError, ValueError):
                      d = None
                  if rc != 0 or rc2 != 0:
                      why = "radar-feed could not be read here either"
                  elif not (isinstance(d, dict) and d.get("v") == 1):
                      got, why = "none", "radar-feed holds no usable index, so a fresh one"
                  else:
                      with open("mb/.xlinks.part", "wb") as f:
                          f.write(raw)
                      os.replace("mb/.xlinks.part", "mb/xlinks.json.gz")
                      got, why = "ok", "fetched it here instead"
          except Exception as e:
              why = "stopped (%s)" % type(e).__name__
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          print("radar feed: step A did not import the X-link index; " + why, file=sys.stderr, flush=True)
          print(got)
          PY
          ) || got=failed
          fi
          if [ "$got" != ok ] && [ "$got" != none ]; then
            echo "radar-feed left as it is: its X-link history could not be read, and a feed from this scan alone would drop it"
            exit 0
          fi
          now=$(python3 - <<'PY'
          import glob, json, time
          ts, late = [], int(time.time() * 1000) + 600_000
          for f in glob.glob("mb/db/memeruns/*.json"):
              try:
                  t = json.load(open(f, encoding="utf-8")).get("t")
              except Exception:
                  continue
              if isinstance(t, int) and not isinstance(t, bool) and 0 < t <= late:
                  ts.append(t)
          print(max(ts) if ts else "")
          PY
          )
          [ -n "$now" ] || now=$(date +%s%3N)
          rm -rf feed
          python3 traps.py feed --dir mb --out feed --now "$now"
          for f in walletmem.json.gz xlinks.json.gz symmc.json.gz meta.json; do
            [ -s "feed/$f" ] || { echo "the feed did not write $f: radar-feed left as it is"; exit 1; }
          done
          python3 traders.py skipfeed --dir mb --out feed/t3skip.json > /dev/null || echo "the learning trader's skip signs not written: the radar pushes as before"
          cd feed && git init -q && git checkout -q -b radar-feed
          git add walletmem.json.gz xlinks.json.gz symmc.json.gz meta.json
          if [ -s t3skip.json ]; then git add t3skip.json; fi
          git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "radar feed $(date -u -d "@$((now / 1000))" +%Y-%m-%dT%H:%MZ)"
          git push -q --force "$RESULTS_URL" HEAD:refs/heads/radar-feed
          echo "radar-feed updated: $(du -ch walletmem.json.gz xlinks.json.gz symmc.json.gz meta.json | tail -1 | cut -f1) at the scan's clock $(date -u -d "@$((now / 1000))" +%H:%MZ)"
      - name: Show the picks on this run's page
        if: always() && steps.recent.outputs.skip != 'true'
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "## Scan ${{ steps.scan.outcome }}: the picks below are from an earlier run" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 bot.py summary >> "$GITHUB_STEP_SUMMARY"
      - name: Build the website folder
        if: steps.recent.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                          # the page reads the live store with the publishable key (public by design);
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}  # bot.py refuses to put anything but an sb_publishable_ key into it
        run: python3 bot.py site --out site --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v3
        if: steps.recent.outputs.skip != 'true'
        with:
          path: site
          retention-days: 1
      - name: Tidy the run list (successful runs older than two days are deleted)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/workflows/scan.yml/runs?status=success&per_page=100" | jq -r --arg c "$cutoff" '.workflow_runs[] | select(.created_at < $c) | .id')
          n=0
          for id in $ids; do
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/runs/$id" && n=$((n+1))
          done
          echo "deleted $n old runs (before $cutoff)"
  pages:
    needs: scan
    if: needs.scan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # without Pages (private repository) this job fails and the run still counts as green
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the website address on this run's page
        run: |
          echo "Website: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
  peaks:
    needs: scan
    if: needs.scan.outputs.skipped != 'true' && needs.scan.result == 'success' && (vars.MEMEBOT_PEAKS || '1') != '0'   # the repository variable MEMEBOT_PEAKS=0 switches the peak category off
    runs-on: ubuntu-latest
    continue-on-error: true          # a failed or slow pricing run never turns the scan red: docs already written stay, the next scan goes on
    timeout-minutes: 21              # about 60 GeckoTerminal calls at its 10 s gap, the exit replay, the shadow rules, the Learning Pick's sales, the learning trader; the next scan waits for this job (the workflow-level group)
    permissions:
      contents: write                # the results branch: the scan job pushed it before this job starts, and nothing else writes it meanwhile
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token in .git/config: only the restore and push steps get it
      - name: Restore the bot's state from the results branch
        id: restore
        env:
          RESULTS_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git   # only here and in the push
        run: |
          if git ls-remote --exit-code --heads "$RESULTS_URL" results >/dev/null; then
            git clone -q --depth 1 --branch results "$RESULTS_URL" mb || (sleep 10 && git clone -q --depth 1 --branch results "$RESULTS_URL" mb)
            echo "state restored: $(git -C mb log -1 --format='%h %s')"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "no results branch yet: nothing to price"
          fi
      - name: Price the closed 6-hour windows (best price within 6 h, hindsight only; GeckoTerminal minute candles, ten minutes at most)
        if: steps.restore.outputs.ok == 'true'
        timeout-minutes: 11
        env:
          MEMEBOT_RADAR_ACCOUNT: ${{ vars.MEMEBOT_RADAR_ACCOUNT || '0' }}   # the old launch-radar paper account: off (two bots only, its data stays); 1 switches it on
        run: python3 peak.py run --dir mb --deadline-s 600
      - name: Replay other stops and targets on the closed paper trades (hindsight only, local computation, two minutes at most)
        if: steps.restore.outputs.ok == 'true'
        continue-on-error: true      # a report: an error or a timeout here never holds back the push below (the script itself exits 0)
        timeout-minutes: 2
        run: python3 exit_grid.py run --dir mb
      - name: The Pick's shadow rules (a 12-hour minute path per pick buy, one GeckoTerminal request each; hindsight only, the Pick's own rule is untouched; two minutes at most)
        if: steps.restore.outputs.ok == 'true'
        continue-on-error: true      # a report: an error or a timeout here never holds back the push below (the script itself exits 0)
        timeout-minutes: 2
        run: python3 shadow.py run --dir mb --deadline-s 90
      - name: The Learning Pick's sales (a 6-hour minute path per buy, one GeckoTerminal request each; its own paper account, the Pick untouched; two minutes at most)
        if: steps.restore.outputs.ok == 'true'
        continue-on-error: true      # a shadow bot: an error or a timeout here never holds back the push below (the script itself exits 0)
        timeout-minutes: 2
        run: python3 lernpick.py run --dir mb --deadline-s 60
      - name: The learning trader's daily step (local computation, no requests; two minutes at most)
        if: steps.restore.outputs.ok == 'true' && (vars.MEMEBOT_TRADERS || '0') == '1'   # off since 22 Oct 2026 (two bots only: Pick and the rocket hunter; its data stays); the repository variable MEMEBOT_TRADERS=1 switches it on
        continue-on-error: true      # a record: an error or a timeout here never holds back the push below (the script itself exits 0)
        timeout-minutes: 3
        run: python3 traders.py run --dir mb
      - name: Push the peak docs to the results branch
        if: ${{ !cancelled() && steps.restore.outputs.ok == 'true' }}
        env:
          RESULTS_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: python3 bot.py sync --remote "$RESULTS_URL"
