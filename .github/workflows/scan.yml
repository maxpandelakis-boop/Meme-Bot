# The bot on GitHub's own servers: no laptop needed.
# Runs every hour at :10 UTC, started by the hourly routine of the Claude session through the GitHub API (a cron start on
# GitHub's own scheduler comes 10 to 20 minutes late), and whenever you press "Run workflow" (github.com -> Actions -> Meme-Bot
# scan). The cron below is the safety net: it fires at :25 and does nothing when this hour's scan was started.
# Each run restores the bot's state from the results branch, scans ~12,000 coins, names the best coin for the next two hours,
# pushes report.html + the small docs back to the results branch and shows the picks in the run's summary.
# When GitHub Pages is switched on (Settings -> Pages -> Source: GitHub Actions; needs a public repository on the free plan),
# the second job publishes the page as a website that phones can keep on the home screen.
# Fake money only: nothing is bought anywhere.
name: Meme-Bot scan
run-name: "${{ inputs.source == 'hourly' && 'Hourly scan' || (github.event_name == 'schedule' && 'Safety-net scan' || 'Scan now') }} · ${{ inputs.horizon || '2h' }} profile${{ inputs.rescan && ' · fresh snapshot' || '' }}"
on:
  schedule:
    - cron: '25 * * * *'            # UTC, the safety net only: the routine starts the real scan at :10; a scheduled run that finds this hour's scan skips itself
  workflow_dispatch:
    inputs:
      horizon:
        description: 'rule profile: 2h (pump in the next two hours) or 24h (survive a day)'
        type: choice
        options: ['2h', '24h']
        default: '2h'
      rescan:
        description: 'force a full scan with a fresh big-test snapshot'
        type: boolean
        default: false
      source:
        description: 'who starts it: the hourly routine passes "hourly" (shown in the run name)'
        type: choice
        options: ['manual', 'hourly']
        default: 'manual'
      export:
        description: 'also export the big-test results to the bigtest branch now (otherwise once a day, at the 06 UTC scan)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write                     # the tidy-up step deletes old runs of this workflow
concurrency:
  group: memebot-scan              # a button press while a scheduled run is going waits for it instead of racing it
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55              # a full scan took 32 to 41 minutes on 2026-10-10 (the training and the candles ran after the fetching then)
    outputs:
      skipped: ${{ steps.recent.outputs.skip }}
    env:
      PYTHONUTF8: '1'
      LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
      BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
      RESULTS_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      HORIZON: ${{ github.event.inputs.horizon || '2h' }}
      RESCAN: ${{ github.event.inputs.rescan == 'true' && '--rescan' || '' }}
    steps:
      - name: Safety net only - skip when this hour's scan was started
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # measured from this run's own creation (it fires at :25, GitHub starts it 10 to 20 minutes late, and it may wait behind a
          # running scan): a scan started by hand or by the routine in the 40 minutes before it, still waiting, running or done well,
          # is this hour's scan. Other safety-net runs do not count: one that skipped itself also ends as a success.
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/scan.yml/runs?per_page=20"
          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api")
          mine=$(echo "$runs" | jq -r --argjson me "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id == $me) | .created_at][0] // empty')
          t=$(date -u -d "${mine:-now}" +%s)
          since=$(date -u -d "@$((t - 2400))" +%Y-%m-%dT%H:%M:%SZ)
          n=$(echo "$runs" | jq -r --arg s "$since" --argjson me "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $me and .event != "schedule" and .created_at > $s and (.status != "completed" or .conclusion == "success"))] | length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This hour's scan was started (the hourly routine did its job): this safety-net run does nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No scan was started this hour: the safety net runs the scan." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.recent.outputs.skip != 'true'
      - name: Restore the bot's state from the results branch
        if: steps.recent.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads "$RESULTS_URL" results >/dev/null; then
            git clone -q --depth 1 --branch results "$RESULTS_URL" mb || (sleep 10 && git clone -q --depth 1 --branch results "$RESULTS_URL" mb)
            echo "state restored: $(git -C mb log -1 --format='%h %s')"
          else
            mkdir -p mb && echo "no results branch yet: fresh start"
          fi
      - name: Keep the big-test snapshots between runs
        if: steps.recent.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            mb/db/memesnap
            mb/db/memesnapres
          key: memebot-snaps-${{ github.run_id }}
          restore-keys: memebot-snaps-
      - name: Scan and recommend
        id: scan
        if: steps.recent.outputs.skip != 'true'
        run: python3 bot.py cycle --recommend --horizon "$HORIZON" $RESCAN
      - name: Export the big-test results to the bigtest branch for offline research (once a day at the 06 UTC scan, or when asked)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" != "06" ] && [ "${{ inputs.export }}" != "true" ]; then echo "bigtest export: once a day at the 06 UTC scan, or with the export input"; exit 0; fi
          rm -rf bt && mkdir -p bt
          tar -C mb/db -czf - memesnapres | split -b 90m - bt/memesnapres.tgz.part-   # GitHub refuses files over 100 MB; research/get_data.sh joins the parts
          tar -C mb/db -czf bt/memeweights.tgz memeweights 2>/dev/null || true
          cp mb/db/memebot/train.json bt/ 2>/dev/null || true
          cd bt && git init -q && git checkout -q -b bigtest && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "big-test results $(date -u +%Y-%m-%dT%H:%MZ)" \
            && git push -q --force "$RESULTS_URL" bigtest && echo "bigtest branch updated: $(du -ch memesnapres.tgz.part-* | tail -1 | cut -f1) in $(ls memesnapres.tgz.part-* | wc -l) part(s)"
      - name: Push the page and the small docs to the results branch
        if: steps.recent.outputs.skip != 'true'
        run: python3 bot.py sync --remote "$RESULTS_URL"
      - name: Show the picks on this run's page
        if: always() && steps.recent.outputs.skip != 'true'
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "## Scan ${{ steps.scan.outcome }}: the picks below are from an earlier run" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 bot.py summary >> "$GITHUB_STEP_SUMMARY"
      - name: Build the website folder
        if: steps.recent.outputs.skip != 'true'
        run: python3 bot.py site --out site --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v3
        if: steps.recent.outputs.skip != 'true'
        with:
          path: site
          retention-days: 1
      - name: Tidy the run list (successful runs older than two days are deleted)
        if: steps.recent.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/workflows/scan.yml/runs?status=success&per_page=100" | jq -r --arg c "$cutoff" '.workflow_runs[] | select(.created_at < $c) | .id')
          n=0
          for id in $ids; do
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/runs/$id" && n=$((n+1))
          done
          echo "deleted $n old runs (before $cutoff)"
  pages:
    needs: scan
    if: needs.scan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # without Pages (private repository) this job fails and the run still counts as green
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the website address on this run's page
        run: |
          echo "Website: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
