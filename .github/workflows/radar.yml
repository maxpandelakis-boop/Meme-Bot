# The launch radar: its own job beside the hourly scan (scan.yml). A round every 5 minutes, 7 to 24 h Berlin: each round rates the coins
# whose DEX pool is under 10 minutes old (launch_radar.py loop; the sources in radar_src.py), keeps the best 5 for the page's New tab,
# records every rating with the later prices the next rounds catch, and sends a push notification only for a coin without a trap found.
# Fake money only: nothing is bought anywhere, and the paper trader never reads what this job writes.
# How it keeps going (no cron: GitHub's timed starts come late or not at all): one run makes a round every 5 minutes for 55 minutes, then its
# last step starts the next run (source auto) when the loop ended well, the Berlin time is inside the hours, the workflow is active and no
# other radar run is running or waiting. The hourly scan's last step starts one when none runs (source hourly: the chain broke, or the
# hours began), "Run workflow" by hand too (source manual); a start while one runs waits in the group until that run ends.
# What it writes: the one-commit branch radar-data (radar.json, the records of the last 48 hours, model.json, pushed.json), the app's
# live store row "radar" (with the Supabase secrets) and its working caches (actions/cache, key radar-cache-<run id>).
# Stop it: Actions -> "Meme-Bot launch radar" -> ... -> Disable workflow (GitHub refuses every start; the running loop sees the switch at
# its next round, writes state off and ends without starting another). Repository variable MEMEBOT_RADAR=0: no run does anything (the
# scan starts none, a start is skipped). MEMEBOT_RADAR_HOURS (default 7-24, Berlin): the active hours; the loop ends when they end, a start
# outside them only writes state hours with the next start.
name: Meme-Bot launch radar
run-name: "Launch radar · ${{ inputs.source || 'manual' }}"
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'who starts it: manual (Run workflow), hourly (the scan, when no radar runs) or auto (the run before); a round every 5 minutes for 55 minutes'
        type: choice
        options: ['manual', 'hourly', 'auto']
        default: 'manual'
permissions:
  contents: write                    # the one-commit branch radar-data
  actions: write                     # the tidy-up of old runs (the kill switch only reads its own workflow's state)
concurrency:
  group: memebot-radar               # one round at a time; a second start waits here until this one ends (never the scan's group)
  cancel-in-progress: false
jobs:
  radar:
    if: (vars.MEMEBOT_RADAR || '1') != '0'   # an unset variable counts as on (compared bare, GitHub skipped the job)
    runs-on: ubuntu-latest
    timeout-minutes: 70              # setup, the push sender, the loop (55 minutes, 62 at most), the cache and the next start
    env:
      PYTHONUTF8: '1'
      MEMEBOT_RADAR_HOURS: ${{ vars.MEMEBOT_RADAR_HOURS || '7-24' }}
      MEMEBOT_RADAR_ADAPTERS: ${{ vars.MEMEBOT_RADAR_ADAPTERS || '' }}   # optional, e.g. swap_trades=0,ll_new=1 (radar_src.ADAPTERS holds the defaults)
      RADAR_SOURCE: ${{ inputs.source || 'manual' }}
      HAS_SUPABASE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}   # only true or false: the secrets themselves go to the steps that use them
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token in .git/config: the radar pushes through its own remote, the pip step runs without one
      - name: Active hours (outside them radar.json says when the radar starts again, once, and the job ends here)
        id: hours
        timeout-minutes: 4
        env:
          RADAR_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # prints inside=true or inside=false; when the check itself fails the round runs and checks the hours itself
          out=$(timeout 150 python3 launch_radar.py hours --dir rd) || out="inside=true"
          echo "${out:-inside=true}" | tail -1 >> "$GITHUB_OUTPUT"
      - name: Restore the radar's working caches (dev wallets, holder wallets, X links, pool ages; a lost cache only makes signals unknown)
        if: steps.hours.outputs.inside == 'true'
        uses: actions/cache/restore@v4
        with:
          path: rdcache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-
      - name: Install the push sender for the iPhone app (only with the Supabase secrets; a minute at most, the scan never depends on it)
        if: steps.hours.outputs.inside == 'true' && env.HAS_SUPABASE == 'true'      # (the only line changed from scan.yml's step)
        continue-on-error: true
        timeout-minutes: 3
        env:
          RESULTS_URL: ''            # the GitHub token stays out of this step
        run: |
          # pywebpush 2.5.0 and every package it needs, exactly as pinned in supabase/push-requirements.txt (each file checked against its
          # sha256; wheels only, so nothing runs while installing; nothing newer is ever fetched), into a folder of its own: the system
          # Python refuses pip installs into itself (PEP 668) on ubuntu 24.04 and on 26.04 (ubuntu-latest from late October 2026). bot.py
          # keeps running on the system Python and imports pywebpush from that folder (MEMEBOT_PUSH_LIB, placed after the standard library)
          # only when it makes the VAPID keys or sends a notification. PyPI down or slow: no notifications this run, the scan goes on.
          lib=""
          opts="-q --disable-pip-version-check --no-input --retries 1 --timeout 10 --require-hashes --only-binary=:all: --no-deps -r supabase/push-requirements.txt"
          if python3 -m venv "$RUNNER_TEMP/pushenv" 2>/dev/null && timeout 60 "$RUNNER_TEMP/pushenv/bin/python" -m pip install $opts; then
            lib=$("$RUNNER_TEMP/pushenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          elif timeout 60 python3 -m pip install $opts --target "$RUNNER_TEMP/pushlib"; then
            lib="$RUNNER_TEMP/pushlib"     # no venv module on this runner: pip's --target needs none and is not refused by PEP 668
          fi
          # http-ece 1.2.1 has no wheel: its one module comes from its sdist, checked against the sha256 PyPI lists (supabase/pin_push.py
          # prints it), without running its setup.py
          ece="$RUNNER_TEMP/http_ece-1.2.1.tar.gz"
          if [ -n "$lib" ] && timeout 30 curl -fsSL --retry 1 -o "$ece" \
               "https://files.pythonhosted.org/packages/7c/af/249d1576653b69c20b9ac30e284b63bd94af6a175d72d87813235caf2482/http_ece-1.2.1.tar.gz" \
             && echo "8c6ab23116bbf6affda894acfd5f2ca0fb8facbcbb72121c11c75c33e7ce8cff  $ece" | sha256sum -c --quiet - \
             && tar -xzf "$ece" -C "$lib" --strip-components=1 http_ece-1.2.1/http_ece/__init__.py \
             && MEMEBOT_PUSH_LIB="$lib" python3 -c "import app; app._push_path(); import pywebpush, http_ece, cryptography" 2>/dev/null; then
            echo "MEMEBOT_PUSH_LIB=$lib" >> "$GITHUB_ENV"
            echo "pywebpush 2.5.0 ready (pinned, hashes checked): this scan sends push notifications"
          else
            echo "pywebpush could not be installed: no push notifications this run, the scan and the live view go on"
          fi
      - name: A round every 5 minutes for 55 minutes (the new pools rated, the records and their later prices, the page's list, a push for a good coin)
        id: loop
        if: steps.hours.outputs.inside == 'true'
        timeout-minutes: 62              # each round stops itself after 125 s; the loop ends after 55 minutes, at the end of the hours or when switched off
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}                          # the kill switch (GitHub's API only, never printed)
          RADAR_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git   # radar-data, read and written
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                          # the app's live store (row "radar") and its push notifications;
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}            # empty without the secrets: nothing of it runs
        run: python3 launch_radar.py loop --dir rd --cadence 300 --deadline 125 --minutes 55
      - name: Save the radar's working caches
        if: always() && steps.hours.outputs.inside == 'true'
        uses: actions/cache/save@v4
        with:
          path: rdcache
          key: radar-cache-${{ github.run_id }}
      - name: Start the next run (when the loop ended well, inside the hours, the workflow active and no other radar run running or waiting)
        if: steps.loop.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_REF: ${{ github.ref_name }}
        run: |
          # Three GitHub API calls at most; the token is sent only to GitHub's API. The new run waits in the group memebot-radar until this
          # one has ended (a minute or two), then makes its first round at once. A loop that failed starts nothing: the next full scan does.
          python3 - <<'PY'
          import datetime as dt, json, os, re, sys, urllib.error, urllib.request
          sys.path.insert(0, ".")
          from launch_radar import parse_hours, in_hours
          wf = "%s/repos/%s/actions/workflows/radar.yml" % (os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/"), os.environ["GITHUB_REPOSITORY"])
          me = str(os.environ.get("GITHUB_RUN_ID") or "")
          say = lambda s: print("next run: " + s, flush=True)

          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method, data=None if body is None else json.dumps(body).encode(),
                                           headers={"Authorization": "Bearer " + os.environ.get("GH_TOKEN", ""), "Accept": "application/vnd.github+json",
                                                    "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "memebot-radar", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as e:
                  return e.code, None

          hours = parse_hours(os.environ.get("MEMEBOT_RADAR_HOURS"))
          if not in_hours(int(dt.datetime.now(dt.timezone.utc).timestamp() * 1000) + 60_000, hours):
              say("the active hours %d-%d Berlin are over: no start (the first full scan inside them starts the radar)" % hours)
              sys.exit(0)
          try:
              st, w = call("GET", wf)
              if st != 200 or not isinstance(w, dict) or w.get("state") != "active":
                  say("the radar workflow is not active (HTTP %s, %s): no start" % (st, re.sub(r"[^a-z_]", "", str((w or {}).get("state")))[:30]))
                  sys.exit(0)
              st, j = call("GET", wf + "/runs?per_page=20")
              runs = j.get("workflow_runs") if isinstance(j, dict) else None
              if st != 200 or not isinstance(runs, list):
                  say("the radar runs could not be read (HTTP %s): no start" % st)
              elif any(isinstance(r, dict) and r.get("status") != "completed" and str(r.get("id")) != me for r in runs):
                  say("another radar run is running or waiting: it goes on, no second one")
              else:
                  st, _ = call("POST", wf + "/dispatches", {"ref": os.environ["RADAR_REF"], "inputs": {"source": "auto"}})
                  say("started (source auto): its first round in about 2 minutes" if st in (200, 201, 204) else "the start was refused (HTTP %s)" % st)
          except Exception as e:
              say("GitHub did not answer (%s): no start, the next full scan starts one" % type(e).__name__)
          PY
      - name: Tidy the run list (successful radar runs older than two days are deleted)
        continue-on-error: true
        timeout-minutes: 2                 # it holds the radar's group: a hanging call never keeps the next round waiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/workflows/radar.yml/runs?status=success&per_page=100" | jq -r --arg c "$cutoff" '.workflow_runs[] | select(.created_at < $c) | .id')
          n=0
          for id in $ids; do
            curl -sS --max-time 10 -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/runs/$id" && n=$((n+1))
          done
          echo "deleted $n old runs (before $cutoff)"
