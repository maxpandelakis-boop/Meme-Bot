# API probe for the launch radar (WP0): started by hand only (Actions -> probe-radar -> Run workflow), never on a push or a schedule.
# Fake money only: it reads public APIs (pump.fun, DexScreener, GeckoTerminal, Jupiter, LaunchLab, RugCheck, Solana RPC, GitHub,
# PumpPortal's websocket for 60 s) and writes nothing anywhere. The log holds only status codes, field names, counts, timings and
# rate-limit headers: never a response body over 300 characters, never a credential, no coin or wallet address. The Supabase secrets
# are only checked for being set (yes/no); their values never reach the job.
name: probe-radar
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-radar
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
      HAS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
      HAS_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the paper positions (results branch, public clone without a token)
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch results "$url" res || (sleep 10 && git clone -q --depth 1 --branch results "$url" res)
          echo "positions on the results branch: $(ls res/db/memepos | wc -l)"
      - name: Probe the live pump.fun feed (PumpPortal's websocket, 60 s; status, counts and field names, never an address)
        continue-on-error: true
        run: timeout 90 python3 radar_feed.py probe --seconds 60
      - name: Probe the radar's sources (about 11 minutes)
        run: python3 research/probe_radar.py --res res --repo "$GITHUB_REPOSITORY"
