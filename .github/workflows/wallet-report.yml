# The wallet study, step 2 (research/wallets, fake money only): started by a push of this file to the thread branch. It reads the
# event files of the wallet-events run named below (run artifacts) and writes the report to the branch "walletdata".
name: wallet-report
on:
  push:
    branches: [claude/project-thread-412hq7]
    paths: [.github/workflows/wallet-report.yml]
permissions:
  contents: write                    # the walletdata branch only
  actions: read                      # the event files of the other run
concurrency:
  group: wallet-report
  cancel-in-progress: true
env:
  EVENTS_RUN: '43025017378'
  MODE: holdout
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: day-*
          path: days
          run-id: ${{ env.EVENTS_RUN }}
          github-token: ${{ github.token }}
      - run: python3 research/wallets/wallet_report.py days rep "$MODE"
      - name: Push to walletdata
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone -q --depth 1 --branch walletdata "$URL" wd || (mkdir wd && cd wd && git init -q -b walletdata)
          cp rep/* wd/
          cd wd && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "wallet study $MODE $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::8}" \
            && git push -q "$URL" walletdata
