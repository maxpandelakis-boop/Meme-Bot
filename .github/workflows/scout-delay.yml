# The scout study with a 2-second buy delay instead of 30 (information, fake money only): started by a push of this file or of research/scout/* to the thread branch
# claude/project-thread-0y2vt9. It downloads public, openly licensed pump.fun data (Slinky21/Pumpfun_v2_dataset, CC BY 4.0) and
# public SOL/USD candles, and force-pushes compact results to the branch "scoutdelay", which nothing else writes. Nothing is bought.
name: scout-delay
on:
  push:
    branches: [claude/project-thread-0y2vt9]
    paths: [.github/workflows/scout-delay.yml]
permissions:
  contents: write                    # the scoutdelay branch only
concurrency:
  group: scout-delay
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  SCOUT_DELAY_MS: '2000'
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        day: [2026-09-24, 2026-09-25, 2026-09-26, 2026-09-27, 2026-09-28, 2026-09-29, 2026-09-30,
              2026-10-01, 2026-10-02, 2026-10-03, 2026-10-04, 2026-10-05, 2026-10-06, 2026-10-07]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyarrow==17.0.0 pandas==2.2.3 numpy==1.26.4
      - name: The file list of the probe
        run: git clone -q --depth 1 --branch scoutdata https://github.com/${{ github.repository }}.git sd
      - name: Day ${{ matrix.day }}
        run: df -h . && python3 research/scout/scout_day.py sd/probe/files.json ${{ matrix.day }} out
      - uses: actions/upload-artifact@v4
        with:
          name: day-${{ matrix.day }}
          path: out/trades_*.json
          retention-days: 14

  report:
    needs: day
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: day-*
          path: days
      - run: python3 research/scout/scout_report.py days days/report
      - name: Push to scoutdelay
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p sd/delay2s && cp days/*/trades_*.json days/report/* sd/delay2s/
          cd sd && git init -q && git checkout -q -b scoutdelay && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "scout delay 2s $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::8}" \
            && git push -q --force "$URL" scoutdelay
