# The wallet study, step 1 (research/wallets, fake money only): started by a push of this file to the thread branch
# claude/project-thread-412hq7. It downloads public, openly licensed pump.fun data (Slinky21/Pumpfun_v2_dataset, CC BY 4.0) and
# public SOL/USD candles, keeps one event file per launch day as a run artifact, and writes the dev-days report to the branch
# "walletdata", which nothing else writes. Nothing is bought.
name: wallet-events
on:
  push:
    branches: [claude/project-thread-412hq7]
    paths: [.github/workflows/wallet-events.yml]
permissions:
  contents: write                    # the walletdata branch only
concurrency:
  group: wallet-events
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        day: [2026-08-10, 2026-08-11, 2026-08-12, 2026-08-13, 2026-08-14, 2026-08-15, 2026-08-16,
              2026-08-17, 2026-08-18, 2026-08-19, 2026-08-20, 2026-08-21, 2026-08-22, 2026-08-23,
              2026-08-24, 2026-08-25, 2026-08-26, 2026-08-27, 2026-08-28, 2026-08-29, 2026-08-30,
              2026-08-31, 2026-09-01, 2026-09-02, 2026-09-03, 2026-09-04, 2026-09-05, 2026-09-06,
              2026-09-07, 2026-09-08, 2026-09-09, 2026-09-10, 2026-09-11, 2026-09-12, 2026-09-13,
              2026-09-14, 2026-09-15, 2026-09-16, 2026-09-17, 2026-09-18, 2026-09-19, 2026-09-20,
              2026-09-21, 2026-09-22, 2026-09-23, 2026-09-24, 2026-09-25, 2026-09-26, 2026-09-27,
              2026-09-28, 2026-09-29, 2026-09-30, 2026-10-01, 2026-10-02, 2026-10-03, 2026-10-04,
              2026-10-05, 2026-10-06]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyarrow==17.0.0 numpy==1.26.4 numba==0.60.0
      - run: python3 research/wallets/selftest_wallets.py
      - name: The file list of the scout study's probe
        run: git clone -q --depth 1 --branch scoutdata https://github.com/${{ github.repository }}.git sd
      - name: Day ${{ matrix.day }}
        run: df -h . && python3 research/wallets/wallet_day.py sd/probe/files.json ${{ matrix.day }} out
      - uses: actions/upload-artifact@v4
        with:
          name: day-${{ matrix.day }}
          path: out/*.npz
          retention-days: 7
          compression-level: 0

  report:
    needs: day
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          pattern: day-*
          path: days
      - run: python3 research/wallets/wallet_report.py days rep dev
      - name: Push to walletdata
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone -q --depth 1 --branch walletdata "$URL" wd || (mkdir wd && cd wd && git init -q -b walletdata)
          cp rep/* wd/ && echo "$GITHUB_RUN_ID" > wd/events_run_id.txt
          cd wd && git add -A \
            && git -c user.name=memebot -c user.email=memebot@users.noreply.github.com commit -q -m "wallet study dev $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::8}" \
            && git push -q "$URL" walletdata
